name: life_pilot
description: "Life Pilot - personal assistance recurring task manager & alarm clock"
publish_to: "none"
version: 1.0.0+1

environment: 
  sdk: ^3.10.7

dependencies: 
  flutter: 
    sdk: flutter

  cupertino_icons: ^1.0.8

  # state management
  flutter_riverpod: ^2.6.1

  # database
  sqflite: ^2.4.2
  path: ^1.9.1

  # notification and alarm
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.0
  android_alarm_manager_plus: ^5.0.0

  # UI
  fl_chart: ^1.2.0
  table_calendar: ^3.1.3
  google_fonts: ^8.1.0

  # Audio & File picking 
  audioplayers: ^6.1.0
  file_picker: ^11.0.2
  path_provider: ^2.1.6
  ffmpeg_kit_flutter: ^6.0.3

  # utils
  uuid: ^4.5.1
  intl: ^0.20.0
  shared_preferences: ^2.3.5

dev_dependencies:
  flutter_test: 
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/